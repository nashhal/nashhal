[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nashhal-ai"
version = "0.1.0"
description = "Machine-learning foundation for Nashhal"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4,<3",
  "transformers>=4.45,<5",
  "datasets>=3,<4",
  "accelerate>=0.34,<2",
  "peft>=0.13,<1",
]
rag = [
  "sentence-transformers>=3,<6",
]
eval = [
  "scikit-learn>=1.5,<2",
]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
